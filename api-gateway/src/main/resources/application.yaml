spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
          - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
      globalcors:
        cors-configurations:
            '[/**]':
              allowed-origins: '*'
              allowed-methods:
                - "GET"
                - "POST"
                - "PUT"
                - "DELETE"
                - "HEAD"
                - "OPTIONS"
              allowed-headers:
                - "Origin"
                - "Content-Type"
                - "Accept"
                - "Authorization"
                - "User-Key"
                - "Request-Tracker"
                - "Session-Tracker"
                - "X-XSRF-TOKEN"
                - "X-IBM-CLIENT-ID"
                - "Message-ID"
                - "X-IBM-CLIENT-SECRET"       

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/file/**

  profiles:
    active:
    - dev
    
server:
  port: 8060

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka



     
